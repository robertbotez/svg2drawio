<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-written in the svg2drawio profile (see AGENTS.md):
     plain rect / ellipse / line / polyline / text elements, hex colours,
     one <marker> for arrowheads. Convert with:
       python3 svg2drawio.py examples/pipeline.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">Build pipeline</text>

  <!-- stages -->
  <rect x="40" y="100" width="140" height="56" rx="8" fill="#e8f1fb" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="110" y="133" text-anchor="middle">Source</text>

  <rect x="250" y="100" width="140" height="56" rx="8" fill="#e8f1fb" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="320" y="125" text-anchor="middle">Build</text>
  <text x="320" y="143" text-anchor="middle" font-size="11" fill="#555555">compile + lint</text>

  <ellipse cx="530" cy="128" rx="70" ry="30" fill="#fff4d6" stroke="#d98c00" stroke-width="1.5"/>
  <text x="530" y="133" text-anchor="middle">Tests pass?</text>

  <rect x="580" y="220" width="110" height="48" rx="8" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="635" y="249" text-anchor="middle">Deploy</text>

  <!-- connectors -->
  <line x1="180" y1="128" x2="250" y2="128" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="128" x2="460" y2="128" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="560,158 560,244 580,244" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="575" y="200" font-size="11" fill="#1a7f37">yes</text>

  <!-- dashed feedback edge -->
  <polyline points="500,158 500,210 320,210 320,156" fill="none" stroke="#b03030" stroke-width="1.5"
            stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="410" y="204" text-anchor="middle" font-size="11" fill="#b03030">no: fix and rebuild</text>
</svg>
